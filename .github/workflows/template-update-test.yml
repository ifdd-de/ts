name: template-update-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install cookiecutter cruft pytest pyyaml
      - name: generate from the latest tag, update to this commit
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "no tag yet - nothing to update from"; exit 0; fi
          git config --global user.email ci@example.org
          git config --global user.name ci
          # The skip list of the README: the hook generates new secrets in every
          # rendering, so without it the update would leave .rej files.
          cruft create --no-input --checkout "$tag" \
            --skip .env --skip secrets --skip grafana/dashboards/private \
            --output-dir inst "file://$PWD"
          cd inst/*
          git init -q && git add -A && git commit -qm "from $tag"
          cruft update --skip-apply-ask --checkout "$GITHUB_SHA"
          if find . -name '*.rej' | grep -q .; then find . -name '*.rej' -exec cat {} +; exit 1; fi
          pytest -q tests
