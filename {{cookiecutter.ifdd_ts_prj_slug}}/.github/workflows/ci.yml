name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pytest pyyaml
      - run: pytest -q tests
      - name: compose files
        run: |
          cp dotenv.dist .env
          sed -i 's|^IFDD_TS_VM_DATA_DIR=.*|IFDD_TS_VM_DATA_DIR=./data|' .env
          sed -i "s|<<host:uid>>|$(id -u)|; s|<<host:gid>>|$(id -g)|" .env
          mkdir -p secrets && touch secrets/grafana_admin_password secrets/grafana_secret_key secrets/oidc_client_secret
          docker compose -f docker-compose-production.yml config --quiet
          docker compose -f docker-compose-development.yml config --quiet
