# Grafana configuration of {{ cookiecutter.ifdd_ts_prj_name }}.
#
# Everything that is the same for every deployment is written here. Values
# that differ between production and development come from environment
# variables set in the compose files ($__env{...}); secrets are read from
# files mounted under /run/secrets ($__file{...}).
#
# Grafana must work without internet access: no update checks, no telemetry,
# no plugin downloads, no external snapshots, no avatars from gravatar.

[server]
root_url = $__env{IFDD_TS_ROOT_URL}

[log]
mode = console

[security]
admin_user = admin
admin_password = $__file{/run/secrets/grafana_admin_password}
secret_key = $__file{/run/secrets/grafana_secret_key}
cookie_secure = $__env{IFDD_TS_COOKIE_SECURE}
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

[auth]
# The login form stays available for the local admin (break-glass access).
disable_signout_menu = false

[auth.generic_oauth]
enabled = $__env{IFDD_TS_OIDC_ENABLED}
name = Keycloak
client_id = $__env{IFDD_TS_OIDC_CLIENT_ID}
client_secret = $__file{/run/secrets/oidc_client_secret}
scopes = openid email profile roles
use_pkce = true
use_refresh_token = true
auth_url = $__env{IFDD_TS_OIDC_ISSUER}/protocol/openid-connect/auth
token_url = $__env{IFDD_TS_OIDC_ISSUER}/protocol/openid-connect/token
api_url = $__env{IFDD_TS_OIDC_ISSUER}/protocol/openid-connect/userinfo
signout_redirect_url = $__env{IFDD_TS_OIDC_ISSUER}/protocol/openid-connect/logout
login_attribute_path = preferred_username
email_attribute_path = email
name_attribute_path = name
allow_sign_up = true
# Keycloak role -> Grafana role. The first match wins:
#   {{ cookiecutter.ifdd_ts_role_admin }} -> Admin, {{ cookiecutter.ifdd_ts_role_editor }} -> Editor, {{ cookiecutter.ifdd_ts_role_viewer }} -> Viewer
# Strict: a user with none of the three roles is not let in.
role_attribute_path = contains({{ cookiecutter.ifdd_ts_roles_claim }} || `[]`, '{{ cookiecutter.ifdd_ts_role_admin }}') && 'Admin' || contains({{ cookiecutter.ifdd_ts_roles_claim }} || `[]`, '{{ cookiecutter.ifdd_ts_role_editor }}') && 'Editor' || contains({{ cookiecutter.ifdd_ts_roles_claim }} || `[]`, '{{ cookiecutter.ifdd_ts_role_viewer }}') && 'Viewer'
role_attribute_strict = true
allow_assign_grafana_admin = false

[plugins]
# Nothing is installed at runtime. The plugins are fetched once by
# adm_01_plugins.sh and mounted read-only at /var/lib/grafana/plugins.
preinstall_disabled = true
plugin_admin_enabled = false
# Verify plugin signatures with the key built into Grafana.
public_key_retrieval_disabled = true
# Bundled data sources this instance does not use. Grafana 13.2.3 starts each
# of them as a process of its own; disabled plugins are not loaded (measured
# on arm64: 3 processes instead of 15, about 18 MB less process memory).
# Kept: prometheus (VictoriaMetrics) and the Infinity plugin. Check the list
# after a Grafana update:
#   ls /usr/share/grafana/data/plugins-bundled   (inside the container)
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[public_dashboards]
enabled = false
